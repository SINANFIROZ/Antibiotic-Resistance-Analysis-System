services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amr_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/amr_platform
      SYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/amr_platform
      JWT_SECRET_KEY: change-me-in-production
      CORS_ORIGINS: '["http://localhost:3000"]'
      AUTO_CREATE_SCHEMA: 'true'
      SEED_REFERENCE_CATALOG: 'true'
    ports:
      - '8000:8000'
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - '3000:3000'
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '80:80'
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
